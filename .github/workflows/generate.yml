name: Generate PoetryKitaab Content

on:
  workflow_dispatch:
    inputs:
      posts:
        description: "Number of posts to generate"
        required: false
        default: "10"
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write

concurrency:
  group: poetrykitaab-content-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      SITE_URL: https://poetrykitaab.pages.dev
      POSTS_PER_RUN: ${{ github.event.inputs.posts || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install automation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r automation/requirements.txt

      - name: Generate content
        run: python -m automation.main --count "$POSTS_PER_RUN"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts public/generated data/generated-log.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: generate new PoetryKitaab content"
          git push
