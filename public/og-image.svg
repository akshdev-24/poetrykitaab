  </text>

  <!-- Bottom Details -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#38342e" stroke-width="1"/>
  <text x="100" y="520" font-family="sans-serif" font-size="16" fill="#883025" font-weight="600">POETRY • SHAYARI • QUOTES • NAZMS • REFLECTIONS</text>
  <text x="1100" y="520" font-family="sans-serif" font-size="15" fill="#7d746c" text-anchor="end">poetrykitaab.com</text>
