<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181f2b"/>
      <stop offset="50%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#rainGrad)"/>
  
  <!-- Blurred City Lights Bokeh -->
  <circle cx="280" cy="220" r="70" fill="#f59e0b" opacity="0.12" filter="blur(20px)"/>
  <circle cx="720" cy="340" r="100" fill="#ea580c" opacity="0.1" filter="blur(30px)"/>
  <circle cx="500" cy="180" r="60" fill="#38bdf8" opacity="0.1" filter="blur(20px)"/>
  
  <!-- Raindrops on glass -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="90" x2="120" y2="130" stroke-width="2"/>
    <line x1="240" y1="210" x2="240" y2="280"/>
    <line x1="380" y1="80" x2="380" y2="170" stroke-width="2.5"/>
    <line x1="620" y1="140" x2="620" y2="220"/>
    <line x1="810" y1="290" x2="810" y2="390" stroke-width="2"/>
    <line x1="490" y1="380" x2="490" y2="460"/>
    <line x1="910" y1="110" x2="910" y2="190"/>
    <line x1="180" y1="410" x2="180" y2="490"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="120" cy="132" r="3"/>
    <circle cx="380" cy="173" r="3.5"/>
    <circle cx="620" cy="222" r="2.5"/>
    <circle cx="810" cy="393" r="3"/>
  </g>
</svg>
