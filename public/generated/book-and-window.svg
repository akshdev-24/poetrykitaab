<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="parchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2824"/>
      <stop offset="60%" stop-color="#1e1c19"/>
      <stop offset="100%" stop-color="#141311"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fdf4dc" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#d4a373" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#parchGrad)"/>
  <rect width="1000" height="650" fill="url(#lampGlow)"/>

  <!-- Window Frame in Background -->
  <rect x="620" y="80" width="280" height="420" rx="4" fill="#0d0c0b" stroke="#3a342c" stroke-width="6"/>
  <line x1="760" y1="80" x2="760" y2="500" stroke="#3a342c" stroke-width="4"/>
  <line x1="620" y1="260" x2="900" y2="260" stroke="#3a342c" stroke-width="4"/>
  <circle cx="820" cy="180" r="30" fill="#f4efe6" opacity="0.15"/>

  <!-- Wooden Table -->
  <polygon points="0,480 1000,480 1000,650 0,650" fill="#181614"/>
  <line x1="0" y1="480" x2="1000" y2="480" stroke="#2e2a24" stroke-width="2"/>

  <!-- Open Book -->
  <path d="M220 520 c60 -20 140 -20 180 5 c40 -25 120 -25 180 -5 l-10 60 c-50 -15 -120 -15 -170 5 c-50 -20 -120 -20 -170 -5 z" fill="#f7f4ee" stroke="#38332c" stroke-width="2"/>
  <path d="M400 525 L400 585" stroke="#883025" stroke-width="2"/>

  <!-- Subtle ruled lines on book page -->
  <line x1="260" y1="535" x2="380" y2="535" stroke="#d5cebf" stroke-width="1.5"/>
  <line x1="260" y1="545" x2="375" y2="545" stroke="#d5cebf" stroke-width="1.5"/>
  <line x1="260" y1="555" x2="360" y2="555" stroke="#d5cebf" stroke-width="1.5"/>
  
  <line x1="420" y1="535" x2="540" y2="535" stroke="#d5cebf" stroke-width="1.5"/>
  <line x1="420" y1="545" x2="535" y2="545" stroke="#d5cebf" stroke-width="1.5"/>
  <line x1="420" y1="555" x2="510" y2="555" stroke="#d5cebf" stroke-width="1.5"/>
</svg>
